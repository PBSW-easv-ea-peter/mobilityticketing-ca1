services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mobility
      POSTGRES_USER: mobility
      POSTGRES_PASSWORD: mobility
    ports:
      - "5432:5432"
    volumes:
      - ./database/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobility -d mobility"]
      interval: 2s
      timeout: 3s
      retries: 15

  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mobility-mongo:/data/db
      - ./database/mongodb:/scripts:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.runCommand({ping:1}).ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - ./database/redis:/scripts:ro

  postgres-l07:
    profiles: ["l07"]
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: mobility_l07
      POSTGRES_USER: ${POSTGRES_USER:-mobility}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mobility}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d mobility_l07"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - mobility-l07-data:/var/lib/postgresql/data
      - ./database/postgres/lecture07/00-create-test-db.sh:/docker-entrypoint-initdb.d/00-create-test-db.sh:ro
      - ./database/postgres/lecture07/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/postgres/lecture07/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  app:
    profiles: ["l07"]
    build: {context: ., target: app}
    depends_on:
      postgres-l07: {condition: service_healthy}
    environment:
      LAB_CONNECTION: Host=postgres-l07;Database=mobility_l07;Username=${POSTGRES_USER:-mobility};Password=${POSTGRES_PASSWORD:-mobility}
      LAB_EVIDENCE: /evidence
    volumes: ["./docs/evidence/lecture07:/evidence"]

  tests:
    profiles: ["l07"]
    build: {context: ., target: tests}
    depends_on:
      postgres-l07: {condition: service_healthy}
    environment:
      LAB_TEST_CONNECTION: Host=postgres-l07;Database=mobility_l07_test;Username=${POSTGRES_USER:-mobility};Password=${POSTGRES_PASSWORD:-mobility}
    volumes: ["./docs/evidence/lecture07:/evidence"]

volumes:
  mobility-mongo:
  mobility-l07-data:
